<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Manager — Personajes</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-dot"></span><strong>Staff Manager</strong></div>
    <nav class="nav">
      <a class="nav-link" href="./dashboard.html">Dashboard</a>
      <a class="nav-link" href="./members.html">Miembros actuales</a>
      <a class="nav-link" href="./inactive.html">Inactivos</a>
      <a class="nav-link" href="./history.html">Historial</a>
      <a class="nav-link active" href="./characters.html">Personajes</a>
    </nav>
    <div class="sidebar-footer muted">v0.1 · panel privado</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left"><h1>Personajes</h1></div>
      <div class="topbar-right">
        <span id="whoami" class="muted">…</span>
        <span class="role-pill" id="staff-role">…</span>
        <button id="theme-toggle" type="button" class="ghost-btn">🌙 Oscuro</button>
        <button id="logout-btn" type="button" class="ghost-btn">Salir</button>
      </div>
    </header>

    <main class="content">
      <p id="chars-error" class="error" role="alert" hidden></p>
      <p id="chars-ok" class="ok" role="status" hidden>Guardado correctamente.</p>

      <section class="panel">
        <header class="panel-header">
          <h2>Añadir personaje</h2>
        </header>
        <form id="add-character-form" class="form-grid">
          <label>Juego
            <select id="new-game" required>
              <option value="">— Elegí un juego —</option>
              <option value="Genshin Impact">Genshin Impact</option>
              <option value="Honkai Star Rail">Honkai Star Rail</option>
              <option value="Honkai Impact 3rd">Honkai Impact 3rd</option>
              <option value="Zenless Zone Zero">Zenless Zone Zero</option>
              <option value="Wuthering Waves">Wuthering Waves</option>
            </select>
          </label>
          <label>Nombre del personaje
            <input id="new-name" type="text" maxlength="80" required placeholder="Ej: Furina" />
          </label>
          <div class="full form-actions">
            <button id="add-btn" type="submit" class="primary-btn">Añadir personaje</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <header class="panel-header panel-header-wrap">
          <div class="filters">
            <input id="search-input" type="search" placeholder="Buscar personaje…" />
            <select id="game-filter">
              <option value="">Todos los juegos</option>
              <option value="Genshin Impact">Genshin Impact</option>
              <option value="Honkai Star Rail">Honkai Star Rail</option>
              <option value="Honkai Impact 3rd">Honkai Impact 3rd</option>
              <option value="Zenless Zone Zero">Zenless Zone Zero</option>
              <option value="Wuthering Waves">Wuthering Waves</option>
            </select>
          </div>
          <span id="chars-count" class="muted">—</span>
          <button id="export-btn" type="button" class="ghost-btn">Exportar TXT (libres)</button>
        </header>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Juego</th>
                <th>Personaje</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="chars-body">
              <tr><td colspan="5" class="muted">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/characters.js"></script>
</body>
</html>
