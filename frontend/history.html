<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Manager — Historial</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-dot"></span><strong>Staff Manager</strong></div>
    <nav class="nav">
      <a class="nav-link" href="./dashboard.html">Dashboard</a>
      <a class="nav-link" href="./members.html">Miembros actuales</a>
      <a class="nav-link" href="./inactive.html">Inactivos</a>
      <a class="nav-link active" href="./history.html">Historial</a>
    </nav>
    <div class="sidebar-footer muted">v0.1 · panel privado</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left"><h1>Historial</h1></div>
      <div class="topbar-right">
        <span id="whoami" class="muted">…</span>
        <span class="role-pill" id="staff-role">…</span>
        <button id="theme-toggle" type="button" class="ghost-btn">🌙 Oscuro</button>
        <button id="logout-btn" type="button" class="ghost-btn">Salir</button>
      </div>
    </header>

    <main class="content">
      <p id="history-error" class="error" role="alert" hidden></p>

      <section class="panel">
        <header class="panel-header panel-header-wrap">
          <div class="filters">
            <input id="search-input" type="search" placeholder="Buscar por usuario o Discord ID…" />
            <select id="type-select">
              <option value="">Todos los tipos</option>
              <option value="JOIN">Solo ingresos</option>
              <option value="LEAVE">Solo salidas</option>
              <option value="REJOIN">Solo reingresos</option>
            </select>
            <input id="date-from" type="date" />
            <input id="date-to" type="date" />
          </div>
          <span id="history-count" class="muted">—</span>
        </header>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Usuario</th>
                <th>Discord ID</th>
                <th>Fecha y hora</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr><td colspan="4" class="muted">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/history.js"></script>
</body>
</html>
