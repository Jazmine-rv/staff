<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Manager — Miembros actuales</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <strong>Staff Manager</strong>
    </div>
    <nav class="nav">
      <a class="nav-link" href="./dashboard.html">Dashboard</a>
      <a class="nav-link active" href="./members.html">Miembros actuales</a>
      <a class="nav-link" href="./inactive.html">Inactivos</a>
      <a class="nav-link" href="./history.html">Historial</a>
    </nav>
    <div class="sidebar-footer muted">v0.1 · panel privado</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1>Miembros actuales</h1>
      </div>
      <div class="topbar-right">
        <span id="whoami" class="muted">…</span>
        <span class="role-pill" id="staff-role">…</span>
        <button id="theme-toggle" type="button" class="ghost-btn">🌙 Oscuro</button>
        <button id="logout-btn" type="button" class="ghost-btn">Salir</button>
      </div>
    </header>

    <main class="content">
      <p id="members-error" class="error" role="alert" hidden></p>

      <section class="panel">
        <header class="panel-header panel-header-wrap">
          <div class="filters">
            <input id="search-input" type="search" placeholder="Buscar por username, nickname o Discord ID…" />
            <select id="sort-select">
              <option value="joined_desc">Ingreso: más reciente</option>
              <option value="joined_asc">Ingreso: más antiguo</option>
              <option value="username_asc">Username: A → Z</option>
              <option value="username_desc">Username: Z → A</option>
            </select>
          </div>
          <span id="members-count" class="muted">—</span>
        </header>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>#</th>
                <th>Avatar</th>
                <th>Username</th>
                <th>Nickname</th>
                <th>Discord ID</th>
                <th>Ingreso</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="members-body">
              <tr><td colspan="8" class="muted">Cargando…</td></tr>
            </tbody>
          </table>
        </div>

        <footer class="pagination">
          <button id="prev-page" class="ghost-btn" type="button">← Anterior</button>
          <span id="page-info" class="muted">—</span>
          <button id="next-page" class="ghost-btn" type="button">Siguiente →</button>
        </footer>
      </section>
    </main>
  </div>

  <script type="module" src="./js/members.js"></script>
</body>
</html>
